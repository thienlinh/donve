name: Deploy Staging

# Fires after the CI workflow finishes on main — not on every push directly —
# so staging only ever deploys a commit that already passed lint/typecheck/test/build.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Filters build to @dv/api + @dv/donve (and everything they depend on, "..." suffix)
      # plus @dv/landing-runtime directly — nothing depends on it via package deps, but the
      # Lighthouse gate below needs its dist/ bundle to size-check. @dv/edge-router needs no
      # build step (JIT TS source, wrangler bundles it directly at deploy time).
      - name: Build API + DonVe app
        run: bunx turbo run build --filter=@dv/api... --filter=@dv/donve... --filter=@dv/landing-runtime
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          VITE_API_URL: https://api-staging.donve.vn

      - name: Run DB migrations (staging Neon branch)
        working-directory: packages/db
        run: bunx drizzle-kit migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Worker secrets (DATABASE_URL, BETTER_AUTH_SECRET, etc.) are NOT synced here — set by
      # hand with `wrangler secret put <KEY> --env staging` (or `secret bulk`) whenever one
      # changes. See docs/runbooks/setup-deployment.md. `wrangler deploy` never clears existing
      # Worker secrets, so this only needs to run again when a value actually changes.
      - name: Deploy API (CF Workers, staging)
        working-directory: apps/api
        run: bunx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # FR-G-01 — CF Workers has no filesystem at request time, so lib/publish.ts reads the
      # compiled runtime script back from R2 instead (RUNTIME_SCRIPT_KEY). Uploaded here, right
      # after the bucket exists (previous step already ran `wrangler deploy`), from the same
      # `bunx turbo run build` output the Lighthouse gate below also reads.
      - name: Upload runtime script to R2 (staging)
        run: bunx wrangler r2 object put dv-landing-deployments-staging/_runtime/index.iife.js --file apps/landing-runtime/dist/index.iife.js --content-type application/javascript --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Serves published landing pages from the R2/KV api's publish pipeline just wrote to
      # (architecture.md §5.2) — deployed after api so the KV/R2 data it reads already exists.
      # No custom domain route attached yet (*.donve.vn wildcard — manual Cloudflare step
      # once the platform domain is locked, see the deployment runbook); the Worker is reachable at
      # its *.workers.dev URL in the meantime.
      - name: Deploy Edge Router (CF Workers, staging)
        working-directory: apps/edge-router
        run: bunx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Separate CF Pages project from prod (dv-donve-staging vs
      # dv-donve) — see the deployment runbook for one-time
      # `wrangler pages project create` setup.
      - name: Deploy DonVe app (CF Pages, staging)
        working-directory: apps/donve
        run: bunx wrangler pages deploy dist --project-name=dv-donve-staging --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # NFR-01 gate (tooling/lighthouse-ci) — no-op until a sample landing page is published on
      # staging and its URL set as the `SAMPLE_LANDING_URL` repo variable (setup-deployment.md).
      # ubuntu-latest ships Google Chrome preinstalled, so chrome-launcher needs no setup step.
      - name: Lighthouse CI gate (NFR-01, sample landing)
        if: vars.SAMPLE_LANDING_URL != ''
        run: bun run tooling/lighthouse-ci/run.ts "${{ vars.SAMPLE_LANDING_URL }}"
