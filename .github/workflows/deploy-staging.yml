name: Deploy Staging

# Fires after the CI workflow finishes on main — not on every push directly —
# so staging only ever deploys a commit that already passed lint/typecheck/test/build.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Filters build to @dv/api + @dv/dashboard and everything they depend
      # on ("..." suffix) — no need to build the rest of the monorepo to deploy.
      - name: Build API + Dashboard
        run: bunx turbo run build --filter=@dv/api... --filter=@dv/dashboard...
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          VITE_API_URL: https://api-staging.donve.vn

      - name: Run DB migrations (staging Neon branch)
        working-directory: packages/db
        run: bunx drizzle-kit migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Idempotent — re-running just overwrites the same secret, which is how
      # rotation works (update the GitHub environment secret, redeploy).
      - name: Sync Worker secrets (staging)
        working-directory: apps/api
        run: |
          echo "${{ secrets.DATABASE_URL }}" | bunx wrangler secret put DATABASE_URL --env staging
          echo "${{ secrets.BETTER_AUTH_SECRET }}" | bunx wrangler secret put BETTER_AUTH_SECRET --env staging
          echo "${{ secrets.UPSTASH_REDIS_URL }}" | bunx wrangler secret put UPSTASH_REDIS_URL --env staging
          echo "${{ secrets.UPSTASH_REDIS_TOKEN }}" | bunx wrangler secret put UPSTASH_REDIS_TOKEN --env staging
          echo "${{ secrets.RESEND_API_KEY }}" | bunx wrangler secret put RESEND_API_KEY --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy API (CF Workers, staging)
        working-directory: apps/api
        run: bunx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Separate CF Pages project from prod (dv-dashboard-staging vs
      # dv-dashboard) — see docs/runbooks/ci-cd-setup.md for one-time
      # `wrangler pages project create` setup.
      - name: Deploy Dashboard (CF Pages, staging)
        working-directory: apps/dashboard
        run: bunx wrangler pages deploy dist --project-name=dv-dashboard-staging --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
