name: Deploy Production

# Manual only — no auto-deploy to prod (infra-deployment-cost.md §6 only
# commits to automatic *staging* deploy). Gate real approval via the "prod"
# GitHub Environment's required reviewers (configure once in repo Settings →
# Environments → prod, see docs/runbooks/ci-cd-setup.md) rather than in this file.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit SHA to deploy (must already be on main / already deployed to staging)"
        required: true
        default: main

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # @dv/landing-runtime is built directly (nothing depends on it, same reasoning as
      # deploy-staging.yml) — its dist/ bundle is uploaded to R2 for the API deploy below.
      - name: Build API + Dashboard
        run: bunx turbo run build --filter=@dv/api... --filter=@dv/dashboard... --filter=@dv/landing-runtime
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          VITE_API_URL: https://api.donve.vn

      - name: Run DB migrations (production)
        working-directory: packages/db
        run: bunx drizzle-kit migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Worker secrets (DATABASE_URL, BETTER_AUTH_SECRET, etc.) are NOT synced here — set by
      # hand with `wrangler secret put <KEY> --env production` (or `secret bulk`) whenever one
      # changes. See docs/runbooks/env-management.md. `wrangler deploy` never clears existing
      # Worker secrets, so this only needs to run again when a value actually changes.
      - name: Deploy API (CF Workers, production)
        working-directory: apps/api
        run: bunx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # FR-G-01 — see the matching step in deploy-staging.yml for why this exists.
      - name: Upload runtime script to R2 (production)
        run: bunx wrangler r2 object put dv-landing-deployments/_runtime/index.iife.js --file apps/landing-runtime/dist/index.iife.js --content-type application/javascript --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # See the matching step in deploy-staging.yml for what this serves and why no custom
      # domain route yet.
      - name: Deploy Edge Router (CF Workers, production)
        working-directory: apps/edge-router
        run: bunx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Dashboard (CF Pages, production)
        working-directory: apps/dashboard
        run: bunx wrangler pages deploy dist --project-name=dv-dashboard --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
