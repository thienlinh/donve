name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Free Vercel remote cache for turbo — set these as repo secrets/vars
      # (see docs/runbooks/ci-cd-setup.md) to make --affected builds share
      # cache across branches/PRs. Harmless no-op if unset (local cache only).
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v7
        with:
          # --affected diffs against git history; turbo needs the full
          # history (base branch / previous commit) to compute it.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # oxlint/oxfmt run once at the repo root (not per-package, see
      # .claude/rules/tech-stack.md) — not turbo tasks, no --affected here.
      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run fmt

      # Single turbo invocation for typecheck+test+build, affected-only —
      # shares the task graph/cache within one run instead of 3 separate ones.
      - name: Typecheck, test, build (affected)
        run: bunx turbo run typecheck test build --affected
