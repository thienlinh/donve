pre-commit:
  parallel: true
  jobs:
    - run: bun run lint --fix {staged_files}
      glob:
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.json"
        - "**/*.jsonc"
        - "**/*.css"
      stage_fixed: true
    - run: bun run fmt {staged_files}
      glob:
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.json"
        - "**/*.jsonc"
        - "**/*.css"
        - "**/*.md"
        - "**/*.yml"
        - "**/*.yaml"
      stage_fixed: true

pre-push:
  jobs:
    - run: bunx turbo run typecheck --affected
